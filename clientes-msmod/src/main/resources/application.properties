# --- 1. CONFIGURACIÓN DEL DATASOURCE (CONEXIÓN) ---

# URL de conexión: PostgreSQL en localhost (puerto 5432) y nombre de la base de datos (ej: 'mi_base_datos').
spring.datasource.url=jdbc:postgresql://localhost:5432/clientesdb

# Nombre de usuario de PostgreSQL (por defecto suele ser 'postgres')
spring.datasource.username=postgres

# Contraseña del usuario
spring.datasource.password=adminf

# Driver JDBC (necesario para PostgreSQL)
spring.datasource.driver-class-name=org.postgresql.Driver

# --- 2. CONFIGURACIÓN DE JPA / HIBERNATE ---

# Estrategia de creación/actualización de la base de datos (ajuste según necesidad)
# Ej: 'update' para actualizar el esquema sin borrar datos.
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=300000