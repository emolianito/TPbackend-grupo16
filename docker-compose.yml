services:
  # Keycloak para autenticación
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    command: start-dev
    ports:
      - "8085:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
      - KC_HTTP_PORT=8080
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - tpi-network

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - keycloak
    networks:
      - tpi-network
    restart: unless-stopped

  # Microservicio de Clientes
  clientes-ms:
    build:
      context: ./clientes-msmod
      dockerfile: Dockerfile
    container_name: clientes-ms
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require
      - SPRING_DATASOURCE_USERNAME=postgres.nxlqnoahtsmvujhuzkwi
      - SPRING_DATASOURCE_PASSWORD=grupo16
    networks:
      - tpi-network
    restart: on-failure

  # Microservicio de Solicitudes
  solicitudes-ms:
    build:
      context: ./solicitudes-ms
      dockerfile: Dockerfile
    container_name: solicitudes-ms
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require
      - SPRING_DATASOURCE_USERNAME=postgres.nxlqnoahtsmvujhuzkwi
      - SPRING_DATASOURCE_PASSWORD=grupo16
      - CLIENTES_SERVICE_URL=http://clientes-ms:8081
      - TRANSPORTE_SERVICE_URL=http://transporte-ms:8083
      - UBICACIONES_SERVICE_URL=http://ubicaciones-ms:8084
    depends_on:
      - clientes-ms
    networks:
      - tpi-network
    restart: on-failure

  # Microservicio de Transporte
  transporte-ms:
    build:
      context: ./transporte-ms
      dockerfile: Dockerfile
    container_name: transporte-ms
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require
      - SPRING_DATASOURCE_USERNAME=postgres.nxlqnoahtsmvujhuzkwi
      - SPRING_DATASOURCE_PASSWORD=grupo16
      - CLIENTES_SERVICE_URL=http://clientes-ms:8081
    networks:
      - tpi-network
    restart: on-failure

  # Microservicio de Ubicaciones
  ubicaciones-ms:
    build:
      context: ./ubicaciones-ms
      dockerfile: Dockerfile
    container_name: ubicaciones-ms
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require
      - SPRING_DATASOURCE_USERNAME=postgres.nxlqnoahtsmvujhuzkwi
      - SPRING_DATASOURCE_PASSWORD=grupo16
      - CLIENTES_SERVICE_URL=http://clientes-ms:8081
    networks:
      - tpi-network
    restart: on-failure

volumes:
  keycloak_data:

networks:
  tpi-network:
    driver: bridge
