# Configuración básica del Gateway
spring.application.name=api-gateway
server.port=8080

# Configuración de Keycloak OAuth2/JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8085/realms/tpi-backend

# Rutas del Gateway - Microservicio de Clientes
spring.cloud.gateway.routes[0].id=clientes-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/clientes/**

# Rutas del Gateway - Microservicio de Solicitudes
spring.cloud.gateway.routes[1].id=solicitudes-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/solicitudes/**

# Rutas del Gateway - Microservicio de Transporte
spring.cloud.gateway.routes[2].id=transporte-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/transporte/**

# Rutas del Gateway - Microservicio de Ubicaciones
spring.cloud.gateway.routes[3].id=ubicaciones-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/ubicaciones/**

# Opcional: Logging para debugging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG