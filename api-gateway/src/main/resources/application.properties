# Application
spring.application.name=api-gateway
server.port=8080

# OAuth2 Resource Server - Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/tpi-backend}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8085/realms/tpi-backend/protocol/openid-connect/certs}

# Microservices URLs
clientes.service.url=${CLIENTES_SERVICE_URL:http://localhost:8081}
ubicaciones.service.url=${UBICACIONES_SERVICE_URL:http://localhost:8084}
solicitudes.service.url=${SOLICITUDES_SERVICE_URL:http://localhost:8082}
transporte.service.url=${TRANSPORTE_SERVICE_URL:http://localhost:8083}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG