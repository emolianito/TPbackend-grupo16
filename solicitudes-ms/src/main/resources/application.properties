# --- 1. CONFIGURACIÓN DEL DATASOURCE (CONEXIÓN) ---

# URL de conexión: PostgreSQL en localhost (puerto 5432) y nombre de la base de datos (ej: 'mi_base_datos').
spring.datasource.url=jdbc:postgresql://localhost:5432/solicitudesdb

# Nombre de usuario de PostgreSQL (por defecto suele ser 'postgres')
spring.datasource.username=postgres

# Contraseña del usuario
spring.datasource.password=adminf

# Driver JDBC (necesario para PostgreSQL)
spring.datasource.driver-class-name=org.postgresql.Driver

# --- 2. CONFIGURACIÓN DE JPA / HIBERNATE ---

# Estrategia de creación/actualización de la base de datos (ajuste según necesidad)
# Ej: 'update' para actualizar el esquema sin borrar datos.
spring.jpa.hibernate.ddl-auto=update

# Muestra las sentencias SQL generadas por Hibernate en la consola
spring.jpa.show-sql=true

# Dialecto específico para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#LOGGS
logging.level.root=INFO

logging.level.com.microservicios.Solicitudes=DEBUG


logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.file.name=logs/solicitudes-ms.log

# Reducir el ruido de Hibernate a solo Advertencias y Errores.
logging.level.org.hibernate=WARN

# Reducir el ruido de Spring Data (scaneo de repositorios)
logging.level.org.springframework.data=WARN

# Reducir el ruido de Spring MVC y los servicios web
logging.level.org.springframework.web=WARN